# Install as /etc/nginx/sites-available/3xui-console and enable it.
# The TLS certificate must exist before enabling the HTTPS server block.
# Replace the documentation address 203.0.113.10 with your public IP.
server {
    listen 80;
    server_name 203.0.113.10;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/3xui-console-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://203.0.113.10$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 203.0.113.10;

    ssl_certificate /etc/letsencrypt/live/3xui-console-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3xui-console-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:3xuiConsoleTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 52m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
